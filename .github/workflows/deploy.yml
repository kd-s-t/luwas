name: Deploy

# Deploys Firestore rules/indexes when secrets are configured.
# Next.js app hosting: connect this repo in Firebase App Hosting (recommended for Cup).
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firestore:
    name: Firestore rules & indexes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip quietly until FIREBASE_TOKEN + FIREBASE_PROJECT_ID are set in repo secrets
    if: ${{ vars.ENABLE_FIREBASE_DEPLOY == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy Firestore
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Set secrets FIREBASE_TOKEN and FIREBASE_PROJECT_ID (and repo variable ENABLE_FIREBASE_DEPLOY=true)."
            exit 1
          fi
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
