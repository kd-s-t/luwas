# Firebase App Hosting — https://firebase.google.com/docs/app-hosting/configure
# Do not commit Google / Firebase API keys as plain values (secret scanning).
# Firebase web API keys are still client-visible at runtime; load from Secret Manager at build.
# Server keys: firebase apphosting:secrets:set NAME  (or gcloud secrets create …)
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  # Set once: firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "nice-pen-181017.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "nice-pen-181017"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "nice-pen-181017.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "192332066427"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:192332066427:web:8c4ac5185db80a7d4b3cde"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://luwas-192332066427.asia-southeast1.run.app"
    availability:
      - BUILD
      - RUNTIME

  # Create with: printf '%s' "$VALUE" | gcloud secrets create NAME --data-file=- --project=nice-pen-181017
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: GOOGLE_WEATHER_API_KEY
    secret: GOOGLE_WEATHER_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    secret: RESEND_FROM_EMAIL
    availability:
      - RUNTIME
